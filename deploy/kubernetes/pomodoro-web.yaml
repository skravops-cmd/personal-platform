apiVersion: apps/v1
kind: Deployment
metadata:
  name: pomodoro-web
  namespace: platform
  labels:
    app.kubernetes.io/name: pomodoro-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pomodoro-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pomodoro-web
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: pomodoro-web
          image: ghcr.io/skravops-cmd/personal-platform/pomodoro-web:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: pomodoro-web
  namespace: platform
  labels:
    app.kubernetes.io/name: pomodoro-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pomodoro-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pomodoro-web
  namespace: platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - pomodoro.skravops-cmd.space
      secretName: pomodoro-web-tls

  rules:
    - host: pomodoro.skravops-cmd.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pomodoro-web
                port:
                  name: http
